<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code 사용량 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: linear-gradient(135deg, #161b22, #1c2333);
      border-radius: 12px;
      border: 1px solid #30363d;
    }

    .header h1 {
      font-size: 28px;
      color: #f0f6fc;
      margin-bottom: 8px;
    }

    .header p {
      color: #8b949e;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      transition: border-color 0.2s;
    }

    .card:hover {
      border-color: #58a6ff;
    }

    .card h2 {
      font-size: 16px;
      color: #8b949e;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .card-value {
      font-size: 32px;
      font-weight: 700;
      color: #f0f6fc;
      line-height: 1.2;
    }

    .card-sub {
      font-size: 13px;
      color: #8b949e;
      margin-top: 6px;
    }

    .card-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #21262d;
    }

    .card-row:last-child {
      border-bottom: none;
    }

    .card-row .label {
      color: #8b949e;
    }

    .card-row .value {
      color: #f0f6fc;
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-pro {
      background: #1f6feb33;
      color: #58a6ff;
      border: 1px solid #1f6feb;
    }

    .badge-free {
      background: #23862633;
      color: #3fb950;
      border: 1px solid #238636;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .chart-container {
      position: relative;
      height: 300px;
      margin-top: 10px;
    }

    /* Token usage table */
    .token-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .token-table th {
      text-align: left;
      padding: 10px 12px;
      background: #0d1117;
      color: #8b949e;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #30363d;
    }

    .token-table th:not(:first-child) {
      text-align: right;
    }

    .token-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #21262d;
      font-size: 14px;
    }

    .token-table td:not(:first-child) {
      text-align: right;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
    }

    .token-table tr:hover {
      background: #1c2333;
    }

    .token-table .total-row {
      font-weight: 700;
      background: #0d111766;
      border-top: 2px solid #30363d;
    }

    .model-name { color: #79c0ff; }
    .tok-input { color: #58a6ff; }
    .tok-output { color: #d2a8ff; }
    .tok-cache-write { color: #e3b341; }
    .tok-cache-read { color: #3fb950; }
    .tok-total { color: #f0f6fc; font-weight: 600; }

    /* Session table */
    .session-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .session-table th {
      text-align: left;
      padding: 10px 12px;
      background: #0d1117;
      color: #8b949e;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      border-bottom: 2px solid #30363d;
    }

    .session-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #21262d;
      font-size: 13px;
    }

    .session-table tr:hover {
      background: #1c2333;
    }

    .session-id {
      color: #58a6ff;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 12px;
    }

    /* Progress bar */
    .progress-bar-container {
      background: #21262d;
      border-radius: 8px;
      height: 24px;
      overflow: hidden;
      margin: 10px 0;
    }

    .progress-bar {
      height: 100%;
      border-radius: 8px;
      transition: width 0.5s ease;
      display: flex;
      align-items: center;
      padding-left: 10px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
    }

    .progress-green { background: linear-gradient(90deg, #238636, #3fb950); }
    .progress-yellow { background: linear-gradient(90deg, #9e6a03, #e3b341); }
    .progress-red { background: linear-gradient(90deg, #da3633, #f85149); }

    /* Hourly heatmap */
    .heatmap {
      display: grid;
      grid-template-columns: repeat(24, 1fr);
      gap: 3px;
      margin-top: 10px;
    }

    .heatmap-cell {
      aspect-ratio: 1;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #8b949e;
      position: relative;
    }

    .heatmap-label {
      display: grid;
      grid-template-columns: repeat(24, 1fr);
      gap: 3px;
      margin-top: 4px;
    }

    .heatmap-label span {
      text-align: center;
      font-size: 10px;
      color: #484f58;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #8b949e;
    }

    .loading .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .refresh-info {
      text-align: center;
      color: #484f58;
      font-size: 12px;
      margin-top: 20px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Claude Code 사용량 대시보드</h1>
    <p id="lastUpdate">데이터 로딩 중...</p>
  </div>

  <div id="dashboard">
    <div class="loading">
      <div class="spinner"></div>
      <p>데이터를 불러오는 중...</p>
    </div>
  </div>

  <div class="refresh-info" id="refreshInfo"></div>

  <script>
    // Format token count
    function fmtTokens(n) {
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
      if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
      return n.toLocaleString();
    }

    // Format duration
    function fmtDuration(ms) {
      if (!ms || ms <= 0) return '-';
      const secs = Math.floor(ms / 1000);
      if (secs < 60) return secs + '초';
      const mins = Math.floor(secs / 60);
      if (mins < 60) return mins + '분 ' + (secs % 60) + '초';
      const hrs = Math.floor(mins / 60);
      return hrs + '시간 ' + (mins % 60) + '분';
    }

    // Format date
    function fmtDate(isoStr) {
      if (!isoStr) return '-';
      const d = new Date(isoStr);
      return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    // Model display names
    const MODEL_NAMES = {
      'claude-opus-4-6': 'Opus 4.6',
      'claude-sonnet-4-5-20250929': 'Sonnet 4.5',
      'claude-haiku-4-5-20251001': 'Haiku 4.5',
      'claude-sonnet-4-20250514': 'Sonnet 4',
      'claude-3-5-sonnet-20241022': 'Sonnet 3.5',
      'claude-3-5-haiku-20241022': 'Haiku 3.5',
    };

    function modelName(id) {
      return MODEL_NAMES[id] || id;
    }

    // API pricing per million tokens
    const MODEL_PRICING = {
      'claude-opus-4-6': { input: 15, output: 75, cacheWrite: 18.75, cacheRead: 1.5 },
      'claude-sonnet-4-5-20250929': { input: 3, output: 15, cacheWrite: 3.75, cacheRead: 0.3 },
      'claude-haiku-4-5-20251001': { input: 0.8, output: 4, cacheWrite: 1, cacheRead: 0.08 },
      'claude-sonnet-4-20250514': { input: 3, output: 15, cacheWrite: 3.75, cacheRead: 0.3 },
    };

    function calcCost(model, usage) {
      const pricing = MODEL_PRICING[model] || MODEL_PRICING['claude-sonnet-4-5-20250929'];
      return (
        (usage.inputTokens * pricing.input / 1_000_000) +
        (usage.outputTokens * pricing.output / 1_000_000) +
        (usage.cacheCreationTokens * pricing.cacheWrite / 1_000_000) +
        (usage.cacheReadTokens * pricing.cacheRead / 1_000_000)
      );
    }

    let dailyChart = null;
    let hourlyChart = null;

    async function loadDashboard() {
      try {
        const [statsRes, accountRes, sessionsRes] = await Promise.all([
          fetch('/api/stats'),
          fetch('/api/account'),
          fetch('/api/sessions'),
        ]);

        const stats = await statsRes.json();
        const account = await accountRes.json();
        const sessions = await sessionsRes.json();

        renderDashboard(stats, account, sessions);

        const now = new Date();
        document.getElementById('lastUpdate').textContent =
          `마지막 업데이트: ${now.toLocaleTimeString('ko-KR')} | 60초마다 자동 갱신`;
        document.getElementById('refreshInfo').textContent =
          `총 ${sessions.length}개 세션 분석 완료`;
      } catch (err) {
        document.getElementById('dashboard').innerHTML =
          `<div class="loading"><p style="color:#f85149;">데이터 로딩 실패: ${err.message}</p></div>`;
      }
    }

    function renderDashboard(stats, account, sessions) {
      // Aggregate totals from sessions
      const totalByModel = {};
      let totalMessages = 0;
      let totalToolCalls = 0;

      for (const s of sessions) {
        totalMessages += s.messageCount;
        totalToolCalls += s.toolCallCount;
        for (const [model, usage] of Object.entries(s.usageByModel)) {
          if (!totalByModel[model]) {
            totalByModel[model] = { inputTokens: 0, outputTokens: 0, cacheCreationTokens: 0, cacheReadTokens: 0 };
          }
          totalByModel[model].inputTokens += usage.inputTokens;
          totalByModel[model].outputTokens += usage.outputTokens;
          totalByModel[model].cacheCreationTokens += usage.cacheCreationTokens;
          totalByModel[model].cacheReadTokens += usage.cacheReadTokens;
        }
      }

      // Grand total tokens
      let grandInput = 0, grandOutput = 0, grandCacheWrite = 0, grandCacheRead = 0, grandCost = 0;
      for (const [model, usage] of Object.entries(totalByModel)) {
        grandInput += usage.inputTokens;
        grandOutput += usage.outputTokens;
        grandCacheWrite += usage.cacheCreationTokens;
        grandCacheRead += usage.cacheReadTokens;
        grandCost += calcCost(model, usage);
      }
      const grandTotal = grandInput + grandOutput + grandCacheWrite + grandCacheRead;

      // Cache efficiency
      const cacheTotal = grandCacheWrite + grandCacheRead;
      const cacheHitRate = cacheTotal > 0 ? (grandCacheRead / cacheTotal * 100) : 0;

      // Subscription badge
      const subType = (account.subscriptionType || 'unknown').toLowerCase();
      const badgeClass = subType === 'pro' ? 'badge-pro' : 'badge-free';
      const badgeText = subType.toUpperCase();

      // Build HTML
      let html = '';

      // Account card
      html += `
        <div class="grid">
          <div class="card">
            <h2>계정 정보</h2>
            <div class="card-row"><span class="label">이름</span><span class="value">${account.displayName || 'N/A'}</span></div>
            <div class="card-row"><span class="label">이메일</span><span class="value">${account.email || 'N/A'}</span></div>
            <div class="card-row"><span class="label">구독</span><span class="value"><span class="badge ${badgeClass}">${badgeText}</span></span></div>
            <div class="card-row"><span class="label">가입일</span><span class="value">${account.accountCreatedAt ? new Date(account.accountCreatedAt).toLocaleDateString('ko-KR') : 'N/A'}</span></div>
            <div class="card-row"><span class="label">첫 사용</span><span class="value">${account.firstStartTime ? new Date(account.firstStartTime).toLocaleDateString('ko-KR') : 'N/A'}</span></div>
          </div>

          <div class="card">
            <h2>총 세션</h2>
            <div class="card-value">${sessions.length}</div>
            <div class="card-sub">전체 세션 수</div>
          </div>

          <div class="card">
            <h2>총 메시지</h2>
            <div class="card-value">${totalMessages.toLocaleString()}</div>
            <div class="card-sub">사용자 메시지</div>
          </div>

          <div class="card">
            <h2>총 토큰 사용량</h2>
            <div class="card-value">${fmtTokens(grandTotal)}</div>
            <div class="card-sub">입력 ${fmtTokens(grandInput)} + 출력 ${fmtTokens(grandOutput)}</div>
          </div>

          <div class="card">
            <h2>API 환산 비용</h2>
            <div class="card-value" style="color: #3fb950;">$${grandCost.toFixed(2)}</div>
            <div class="card-sub">Pro 구독 $20/월 대비 ${grandCost > 20 ? '$' + (grandCost - 20).toFixed(2) + ' 절약' : ''}</div>
          </div>

          <div class="card">
            <h2>캐시 효율</h2>
            <div class="card-value" style="color: ${cacheHitRate >= 50 ? '#3fb950' : cacheHitRate >= 25 ? '#e3b341' : '#f85149'};">${cacheHitRate.toFixed(1)}%</div>
            <div class="card-sub">캐시 히트율 (읽기 ${fmtTokens(grandCacheRead)} / 전체 ${fmtTokens(cacheTotal)})</div>
          </div>
        </div>`;

      // Model token usage table
      html += `
        <div class="grid">
          <div class="card full-width">
            <h2>모델별 토큰 사용량</h2>
            <table class="token-table">
              <thead>
                <tr>
                  <th>모델</th>
                  <th>입력</th>
                  <th>출력</th>
                  <th>캐시 쓰기</th>
                  <th>캐시 읽기</th>
                  <th>합계</th>
                  <th>비용 (API 환산)</th>
                </tr>
              </thead>
              <tbody>`;

      for (const [model, usage] of Object.entries(totalByModel).sort()) {
        const total = usage.inputTokens + usage.outputTokens + usage.cacheCreationTokens + usage.cacheReadTokens;
        const cost = calcCost(model, usage);
        html += `
                <tr>
                  <td class="model-name">${modelName(model)}</td>
                  <td class="tok-input">${fmtTokens(usage.inputTokens)}</td>
                  <td class="tok-output">${fmtTokens(usage.outputTokens)}</td>
                  <td class="tok-cache-write">${fmtTokens(usage.cacheCreationTokens)}</td>
                  <td class="tok-cache-read">${fmtTokens(usage.cacheReadTokens)}</td>
                  <td class="tok-total">${fmtTokens(total)}</td>
                  <td style="color:#f85149;font-weight:600;">$${cost.toFixed(2)}</td>
                </tr>`;
      }

      if (Object.keys(totalByModel).length > 1) {
        html += `
                <tr class="total-row">
                  <td><strong>합계</strong></td>
                  <td class="tok-input"><strong>${fmtTokens(grandInput)}</strong></td>
                  <td class="tok-output"><strong>${fmtTokens(grandOutput)}</strong></td>
                  <td class="tok-cache-write"><strong>${fmtTokens(grandCacheWrite)}</strong></td>
                  <td class="tok-cache-read"><strong>${fmtTokens(grandCacheRead)}</strong></td>
                  <td class="tok-total"><strong>${fmtTokens(grandTotal)}</strong></td>
                  <td style="color:#f85149;font-weight:700;"><strong>$${grandCost.toFixed(2)}</strong></td>
                </tr>`;
      }

      html += `
              </tbody>
            </table>
          </div>
        </div>`;

      // Daily activity chart
      html += `
        <div class="grid">
          <div class="card full-width">
            <h2>일별 활동</h2>
            <div class="chart-container">
              <canvas id="dailyChart"></canvas>
            </div>
          </div>
        </div>`;

      // Hourly usage pattern
      html += `
        <div class="grid">
          <div class="card full-width">
            <h2>시간대별 사용 패턴</h2>
            <div class="chart-container" style="height:200px;">
              <canvas id="hourlyChart"></canvas>
            </div>
          </div>
        </div>`;

      // Session list table
      html += `
        <div class="grid">
          <div class="card full-width">
            <h2>세션 목록</h2>
            <table class="session-table">
              <thead>
                <tr>
                  <th>세션 ID</th>
                  <th>이름</th>
                  <th>시작 시간</th>
                  <th>소요 시간</th>
                  <th style="text-align:right">메시지</th>
                  <th style="text-align:right">도구 호출</th>
                  <th style="text-align:right">토큰</th>
                </tr>
              </thead>
              <tbody>`;

      for (const s of sessions) {
        html += `
                <tr>
                  <td class="session-id">${s.sessionId.substring(0, 8)}...</td>
                  <td>${s.displayName || '-'}</td>
                  <td>${fmtDate(s.startTime)}</td>
                  <td>${fmtDuration(s.durationMs)}</td>
                  <td style="text-align:right">${s.messageCount}</td>
                  <td style="text-align:right">${s.toolCallCount}</td>
                  <td style="text-align:right;font-family:monospace;">${fmtTokens(s.totalTokens)}</td>
                </tr>`;
      }

      html += `
              </tbody>
            </table>
          </div>
        </div>`;

      document.getElementById('dashboard').innerHTML = html;

      // Render charts
      renderDailyChart(stats, sessions);
      renderHourlyChart(stats, sessions);
    }

    function renderDailyChart(stats, sessions) {
      // Aggregate daily data from sessions
      const dailyData = {};

      for (const s of sessions) {
        if (!s.startTime) continue;
        const date = s.startTime.substring(0, 10);
        if (!dailyData[date]) {
          dailyData[date] = { messages: 0, sessions: 0, toolCalls: 0, tokens: 0 };
        }
        dailyData[date].messages += s.messageCount;
        dailyData[date].sessions += 1;
        dailyData[date].toolCalls += s.toolCallCount;
        dailyData[date].tokens += s.totalTokens;
      }

      // Also merge from stats-cache dailyActivity
      if (stats.dailyActivity) {
        for (const day of stats.dailyActivity) {
          if (!dailyData[day.date]) {
            dailyData[day.date] = { messages: 0, sessions: 0, toolCalls: 0, tokens: 0 };
          }
          // Use stats-cache values if larger (they include subagent data)
          if (day.messageCount > dailyData[day.date].messages) {
            dailyData[day.date].messages = day.messageCount;
          }
          if (day.sessionCount > dailyData[day.date].sessions) {
            dailyData[day.date].sessions = day.sessionCount;
          }
          if (day.toolCallCount > dailyData[day.date].toolCalls) {
            dailyData[day.date].toolCalls = day.toolCallCount;
          }
        }
      }

      const dates = Object.keys(dailyData).sort();
      const ctx = document.getElementById('dailyChart');
      if (!ctx) return;

      if (dailyChart) dailyChart.destroy();

      dailyChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: dates,
          datasets: [
            {
              label: '메시지',
              data: dates.map(d => dailyData[d].messages),
              backgroundColor: '#58a6ff88',
              borderColor: '#58a6ff',
              borderWidth: 1,
            },
            {
              label: '도구 호출',
              data: dates.map(d => dailyData[d].toolCalls),
              backgroundColor: '#d2a8ff88',
              borderColor: '#d2a8ff',
              borderWidth: 1,
            },
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: { color: '#8b949e' }
            }
          },
          scales: {
            x: {
              ticks: { color: '#8b949e' },
              grid: { color: '#21262d' }
            },
            y: {
              ticks: { color: '#8b949e' },
              grid: { color: '#21262d' }
            }
          }
        }
      });
    }

    function renderHourlyChart(stats, sessions) {
      // Build hourly counts
      const hourCounts = new Array(24).fill(0);

      // From stats-cache
      if (stats.hourCounts) {
        for (const [hour, count] of Object.entries(stats.hourCounts)) {
          hourCounts[parseInt(hour)] += count;
        }
      }

      // From sessions
      for (const s of sessions) {
        if (!s.startTime) continue;
        const hour = new Date(s.startTime).getHours();
        hourCounts[hour]++;
      }

      const ctx = document.getElementById('hourlyChart');
      if (!ctx) return;

      if (hourlyChart) hourlyChart.destroy();

      const maxCount = Math.max(...hourCounts, 1);

      hourlyChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: Array.from({length: 24}, (_, i) => `${i}시`),
          datasets: [{
            label: '활동 횟수',
            data: hourCounts,
            backgroundColor: hourCounts.map(c => {
              const intensity = c / maxCount;
              if (intensity === 0) return '#21262d';
              if (intensity < 0.33) return '#0e4429';
              if (intensity < 0.66) return '#006d32';
              return '#26a641';
            }),
            borderColor: '#30363d',
            borderWidth: 1,
            borderRadius: 4,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            x: {
              ticks: { color: '#8b949e', font: { size: 10 } },
              grid: { display: false }
            },
            y: {
              ticks: { color: '#8b949e' },
              grid: { color: '#21262d' }
            }
          }
        }
      });
    }

    // Initial load
    loadDashboard();

    // Auto-refresh every 60 seconds
    setInterval(loadDashboard, 60000);
  </script>
<script src="script.js"></script>
</body>
</html>
